[package]
name = "autoguiwork-app"
version = "0.1.0"
description = "autoguiwork desktop app"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rustautogui = { workspace = true }
base64 = { workspace = true }

# The engine — every automation capability lives here, shared with the CLI.
autoguiwork = { package = "autoguiwork-core", path = "../core" }
