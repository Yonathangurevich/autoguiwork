[package]
name = "autoguiwork"
version = "0.1.0"
edition = "2024"

[dependencies]
rustautogui = "2.5.0"
msgbox = "0.7.0"
dirs = "6.0.0"
chrono = "0.4.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[[bin]]
name = "autoWork"
path = "src/main.rs"

[dependencies.windows]
version = ">=0.59, <=0.62"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"]