[workspace]
resolver = "2"
members = ["core", "cli", "src-tauri"]

# Shared dependency versions live here so every crate uses the same ones.
[workspace.dependencies]
rustautogui = "2.5.0"
dirs = "6.0.0"
chrono = "0.4.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
rand = "0.8"
axum = "0.7"
windows = { version = ">=0.59, <=0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
